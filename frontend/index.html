<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>習慣追蹤</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            font-family: sans-serif
                /* 挑一個字體,例如 sans-serif */
            ;
            max-width: 500px
                /* 限制內容寬度,例如 600px,才不會拉太寬 */
            ;
            /* margin
                /* 讓它水平置中的技巧:0 auto */

            padding: 20px
                /* 離邊緣的距離,例如 20px */
            ;
            background-color: #f5f5f5
                /* 挑個淡色背景,例如 #f5f5f5 */
            ;
        }

        input {
            padding: 8px
                /* 內距,例如 8px 12px,讓框裡的字不要貼邊 */
            ;
            border: 1px
                /* 邊框,例如 1px solid #ccc */
            ;
            border-radius: 4px
                /* 圓角,例如 4px */
            ;
            font-size: 14px
                /* 字大一點,例如 16px */
            ;
        }

        button {
            padding: 8px
                /* 例如 8px 16px */
            ;
            border: none
                /* 通常按鈕不要邊框:none */
            ;
            border-radius: 4px
                /* 圓角 4px */
            ;
            background-color: #4a90d9
                /* 挑個主色,例如 #4a90d9 藍色 */
            ;
            color: white
                /* 字的顏色,深色背景配 white */
            ;
            cursor: pointer
                /* 滑鼠移上去變手指:pointer */
            ;
            font-size: 14px;
            ;
            margin: 4px
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>我的習慣</h1>

        <input v-model="newHabitName" placeholder="輸入新習慣">
        <button @click="addHabit">新增</button>

        <ul>
            <li v-for="habit in habits" :key="habit.id">
                {{ habit.name }} — 連續 {{ habit.streak }} 天
                <button @click="checkin(habit.id)">打卡</button>
                <button @click="deleteHabit(habit.id)">刪除</button>
            </li>
        </ul>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    habits: [],
                    newHabitName: ''
                }
            },
            mounted() {
                this.loadHabits()
            },
            methods: {
                loadHabits() {
                    fetch('http://localhost:8000/habits')
                        .then(response => response.json())
                        .then(data => {
                            this.habits = data.map(habit => ({ ...habit, streak: 0 }))
                            this.habits.forEach(habit => {
                                fetch(`http://localhost:8000/habits/${habit.id}/streak`)
                                    .then(response => response.json())
                                    .then(streakData => {
                                        habit.streak = streakData.streak
                                    })
                            })
                        })
                },
                addHabit() {
                    fetch('http://localhost:8000/habits', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: this.newHabitName })
                    })
                        .then(response => response.json())
                        .then(newHabit => {
                            this.habits.push(newHabit)
                            this.newHabitName = ''
                        })
                },
                checkin(habitId) {
                    fetch(`http://localhost:8000/habits/${habitId}/checkin`, {
                        method: 'POST'
                    })
                        .then(response => response.json())
                        .then(result => {
                            alert('打卡結果:' + JSON.stringify(result))

                            fetch(`http://localhost:8000/habits/${habitId}/streak`)
                                .then(response => response.json())
                                .then(streakData => {
                                    const habit = this.habits.find(h => h.id === habitId)   // 找出那一筆
                                    habit.streak = streakData.streak
                                })                         // 更新它(這是「修改已存在欄位」,Vue 追蹤得到!)

                        })
                },
                deleteHabit(habitId) {
                    fetch(`http://localhost:8000/habits/${habitId}`, {
                        method: 'DELETE'
                    })
                        .then(response => response.json())
                        .then(() => {
                            this.habits = this.habits.filter(h => h.id !== habitId)
                        })
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
