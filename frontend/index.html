<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>習慣追蹤 Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            
            /* Curated Color Palette */
            --primary: #6366f1; /* Indigo */
            --primary-hover: #4f46e5;
            --success: #10b981; /* Emerald */
            --success-hover: #059669;
            --danger: #f43f5e; /* Rose */
            --danger-hover: #e11d48;
            --accent: #f59e0b; /* Amber */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        #app {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(to right, #a5b4fc, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-checkin {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: #ffffff;
            font-size: 13px;
            padding: 8px 14px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        }

        .btn-checkin:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-delete {
            background: rgba(244, 63, 94, 0.15);
            color: var(--danger);
            font-size: 13px;
            padding: 8px 14px;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .btn-delete:hover {
            background: var(--danger);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
            transform: translateY(-1.5px);
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        li {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .habit-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .habit-name {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-primary);
        }

        .habit-streak {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .streak-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
            #app {
                padding: 24px 16px;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>✨ 習慣追蹤 App</h1>

        <div class="input-group">
            <input v-model="newHabitName" placeholder="輸入你想建立的新習慣..." @keyup.enter="addHabit">
            <button class="btn-add" @click="addHabit">
                <span>新增習慣</span>
            </button>
        </div>

        <ul>
            <li v-for="habit in habits" :key="habit.id">
                <div class="habit-info">
                    <span class="habit-name">{{ habit.name }}</span>
                    <span class="habit-streak">
                        連續打卡 
                        <span class="streak-badge">🔥 {{ habit.streak }} 天</span>
                    </span>
                </div>
                <div class="actions">
                    <button class="btn-checkin" @click="checkin(habit.id)">打卡</button>
                    <button class="btn-delete" @click="deleteHabit(habit.id)">刪除</button>
                </div>
            </li>
        </ul>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    habits: [],
                    newHabitName: ''
                }
            },
            mounted() {
                this.loadHabits()
            },
            methods: {
                loadHabits() {
                    fetch('http://localhost:8000/habits')
                        .then(response => response.json())
                        .then(data => {
                            this.habits = data.map(habit => ({ ...habit, streak: 0 }))
                            this.habits.forEach(habit => {
                                fetch(`http://localhost:8000/habits/${habit.id}/streak`)
                                    .then(response => response.json())
                                    .then(streakData => {
                                        habit.streak = streakData.streak
                                    })
                            })
                        })
                },
                addHabit() {
                    fetch('http://localhost:8000/habits', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: this.newHabitName })
                    })
                        .then(response => response.json())
                        .then(newHabit => {
                            this.habits.push(newHabit)
                            this.newHabitName = ''
                        })
                },
                checkin(habitId) {
                    fetch(`http://localhost:8000/habits/${habitId}/checkin`, {
                        method: 'POST'
                    })
                        .then(response => response.json())
                        .then(result => {
                            alert('打卡結果:' + JSON.stringify(result))

                            fetch(`http://localhost:8000/habits/${habitId}/streak`)
                                .then(response => response.json())
                                .then(streakData => {
                                    const habit = this.habits.find(h => h.id === habitId)   // 找出那一筆
                                    habit.streak = streakData.streak
                                })                         // 更新它(這是「修改已存在欄位」,Vue 追蹤得到!)

                        })
                },
                deleteHabit(habitId) {
                    fetch(`http://localhost:8000/habits/${habitId}`, {
                        method: 'DELETE'
                    })
                        .then(response => response.json())
                        .then(() => {
                            this.habits = this.habits.filter(h => h.id !== habitId)
                        })
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
